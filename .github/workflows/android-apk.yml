name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK contents:"
          ls -la "$ANDROID_HOME" || true
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          # keep exit code from gradle
          exit ${PIPESTATUS[0]}

      - name: Print build errors on failure
        if: failure()
        run: |
          echo "===== LAST 80 LINES OF BUILD LOG ====="
          tail -n 80 build.log || true
          echo "===== COMPILE ERRORS ====="
          grep -E "e: |error:|FAILED|What went wrong" build.log || true

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-percent-habits-native
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
