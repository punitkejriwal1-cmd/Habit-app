name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Post compiler errors to Issues
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build.log', 'utf8');
            const lines = log.split('\n');
            const errors = lines.filter(l =>
              l.includes('e: ') ||
              l.includes('error:') ||
              l.includes('Unresolved') ||
              l.includes('What went wrong') ||
              l.includes('FAILED')
            ).slice(0, 80).join('\n');
            const tail = lines.slice(-40).join('\n');
            const body = '### Compiler / build errors\n\n```\n' + (errors || '(none matched)') + '\n```\n\n### Log tail\n\n```\n' + tail + '\n```\n';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI build failed on ' + context.sha.substring(0, 7),
              body
            });

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: one-percent-habits-native
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
